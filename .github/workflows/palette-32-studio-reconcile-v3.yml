name: Palette 32 Studio reconciliation v3

on:
  push:
    branches:
      - palette/32-variants-studio-reconciled

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: palette/32-variants-studio-reconciled
          fetch-depth: 0
      - name: Apply reconciliation patch
        run: |
          python3 Tools/palette32_studio_patch.py
          git diff --check
      - name: Run tests
        run: ./test.sh
      - name: Build app
        run: ./build.sh
      - name: Commit, remove helpers, and push
        run: |
          git config user.name "Palette"
          git config user.email "actions@users.noreply.github.com"
          rm -f Tools/palette32_studio_patch.py
          rm -f .github/workflows/palette-32-studio-reconcile.yml
          rm -f .github/workflows/palette-32-studio-reconcile-v2.yml
          rm -f .github/workflows/palette-32-studio-reconcile-v3.yml
          git add -A
          git diff --cached --check
          git commit -m "Finish #32 Studio variant authoring"
          git push origin HEAD:palette/32-variants-studio-reconciled
