name: Finalize issue 28 Track C wording

on:
  push:
    branches: [issue-28-studio-shader-authoring]

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: issue-28-studio-shader-authoring
          fetch-depth: 0
      - name: Correct shader byte label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/Harness/StudioInspector.swift')
          s = p.read_text()
          old = 'value: "\\(shader.source.utf8.count) chars · \\(shader.speed)×"'
          new = 'value: "\\(shader.source.utf8.count) bytes · \\(shader.speed)×"'
          if old not in s:
              raise SystemExit('shader byte label anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Parse and compile app target
        run: |
          swiftc -frontend -parse Sources/Harness/StudioInspector.swift
          swift build --product IdlesseApp
      - name: Commit corrected tree
        run: |
          rm -f .github/workflows/trackc-wording.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct shader source byte label (#28)"
          git push origin HEAD:issue-28-studio-shader-authoring
