name: Palette 32 motion rehearsal v2

on:
  push:
    branches:
      - palette/32-motion-rehearsal

permissions:
  contents: read

jobs:
  merge-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: palette/32-motion-rehearsal
          fetch-depth: 0
      - name: Merge and resolve current motion branch
        run: |
          git fetch origin animator/issue-38-property-motion
          git merge --no-commit --no-edit origin/animator/issue-38-property-motion || true
          git checkout --theirs Sources/Harness/StudioWindowController.swift test.sh
          python3 Tools/palette32_motion_resolve.py
          git add Sources/Harness/StudioWindowController.swift test.sh
          if git diff --name-only --diff-filter=U | grep .; then
            echo "Unresolved merge conflicts remain" >&2
            exit 1
          fi
          git diff --check HEAD
      - name: Run tests
        run: ./test.sh
      - name: Build app
        run: ./build.sh
