name: Palette 32 host and Library integration

on:
  push:
    branches:
      - palette/32-variants-host-library

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: palette/32-variants-host-library
          fetch-depth: 0
      - name: Apply variant host and Library slice
        run: |
          python3 <<'PY'
          import subprocess
          raw = subprocess.check_output([
              "git", "show", "HEAD^:.github/workflows/palette-32-host-library.yml"
          ], text=True)
          begin = "          python3 <<'PY'\n"
          end = "\n          PY"
          body = raw[raw.index(begin) + len(begin):raw.rindex(end)]
          lines = []
          inside = False
          for line in body.splitlines():
              lines.append(line if inside else (line[10:] if line.startswith("          ") else line))
              if line.count("'''") % 2:
                  inside = not inside
          code = "\n".join(lines) + "\n"
          compile(code, "palette32_host_library.py", "exec")
          exec(code, {"__name__": "__main__"})
          PY
          git diff --check
      - name: Run focused and full checks
        run: ./test.sh
      - name: Commit, remove helper, and push
        run: |
          git config user.name "Palette"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/palette-32-host-library.yml
          git add -A
          git diff --cached --check
          git commit -m "Finish #32 wallpaper and Library variant selection"
          git push origin HEAD:palette/32-variants-host-library
