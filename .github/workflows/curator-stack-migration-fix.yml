name: Curator Stack Migration Fix
on:
  push:
    branches: [curator/library-stacks-36-migration-fix]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: python3 .github/curator_stack_migration_fix.py
      - run: bash test.sh
      - run: swift build --product IdlesseApp
      - name: Commit fix
        run: |
          git config user.name '📚 Curator'
          git config user.email 'curator@users.noreply.github.com'
          git add Sources/Harness/SceneLibrarySQLiteStore.swift
          git commit -m 'Keep Library SQLite schema metadata in sync (#36)' -m 'Advance catalog_meta alongside PRAGMA user_version during the schema-v1 to v2 stack upgrade.' -m '📚 Curator'
          git push origin HEAD:curator/library-stacks-36-migration-fix
