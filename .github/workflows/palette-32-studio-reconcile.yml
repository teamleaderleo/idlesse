name: Palette 32 Studio reconciliation

on:
  push:
    branches:
      - palette/32-variants-studio-reconciled

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: palette/32-variants-studio-reconciled
          fetch-depth: 0
      - name: Reconcile Studio variant integration
        run: |
          echo '' | base64 --decode > /tmp/palette32_studio.py
          python3 /tmp/palette32_studio.py
          git diff --check
      - name: Run tests
        run: ./test.sh
      - name: Build app
        run: ./build.sh
      - name: Commit, remove helper, and push
        run: |
          git config user.name "Palette"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/palette-32-studio-reconcile.yml
          git add -A
          git diff --cached --check
          git commit -m "Finish #32 Studio variant authoring"
          git push origin HEAD:palette/32-variants-studio-reconciled
