name: Curator Stack Schema Upgrade

on:
  push:
    branches: [curator/library-stacks-36-schema-exec]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply schema upgrade patch
        run: python3 .github/curator_stacks_schema_patch.py
      - name: Run catalog tests
        run: bash test.sh
      - name: Compile app
        run: swift build --product IdlesseApp
      - name: Commit upgrade
        run: |
          git config user.name '📚 Curator'
          git config user.email 'curator@users.noreply.github.com'
          git add Sources/Harness/SceneLibrarySQLiteStore.swift
          git commit -m 'Version Library stack SQLite additions (#36)' -m 'Upgrade selected Quarry schema-v1 catalogs in place before reading stack relationships.' -m '📚 Curator'
          git push origin HEAD:curator/library-stacks-36-schema-exec
