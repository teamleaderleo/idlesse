name: Palette 32 host fix

on:
  push:
    branches:
      - palette/32-variants-host-library

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: palette/32-variants-host-library
          fetch-depth: 0
      - name: Apply fix
        run: |
          python3 Tools/palette32_host_fix.py
          git diff --check
      - name: Run tests
        run: ./test.sh
      - name: Build app
        run: ./build.sh
      - name: Commit, remove helpers, and push
        run: |
          git config user.name "Palette"
          git config user.email "actions@users.noreply.github.com"
          rm -f Tools/palette32_host_fix.py .github/workflows/palette-32-host-fix.yml
          git add -A
          git diff --cached --check
          git commit -m "Preserve missing #32 variant references"
          git push origin HEAD:palette/32-variants-host-library
