name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swiftc --version

      - name: Verify media pipeline helpers
        run: |
          python3 -m venv "$RUNNER_TEMP/media-tests"
          "$RUNNER_TEMP/media-tests/bin/pip" install --quiet --disable-pip-version-check "Pillow==11.3.0"
          "$RUNNER_TEMP/media-tests/bin/python" scripts/media-batch/test_batch.py
          PYTHONPATH="$PWD/scripts/media-batch" "$RUNNER_TEMP/media-tests/bin/python" scripts/media-batch/test_fidelity.py
          pushd scripts/media-batch
          npm ci --ignore-scripts --no-audit --no-fund
          node_modules/.bin/esbuild fast-export.js --bundle --outfile="$RUNNER_TEMP/fast-export.bundle.js"
          xcrun swiftc Render.swift -o "$RUNNER_TEMP/media-render" -framework AppKit -framework WebKit
          xcrun swiftc Encode.swift -o "$RUNNER_TEMP/media-encode" -framework AppKit -framework WebKit
          popd

      - name: Build development preview and arm64 saver
        run: ./build.sh

      - name: Smoke-test settings UI
        run: '"build/Idlesse.app/Contents/MacOS/Idlesse" --smoke-options'

      - name: Verify unit and preview bounds tests
        run: bash test.sh

      - name: Verify Main10 native media compatibility
        run: |
          command -v ffprobe >/dev/null || brew install ffmpeg
          bash test-media-compat.sh

      - name: Verify Library UI smoke
        run: IDLESSE_LIBRARY_UI_PROBE_ONLY=1 bash test-media-compat.sh

      - name: Verify selection transaction isolation
        run: '"build/Idlesse.app/Contents/MacOS/Idlesse" --smoke-selection-transactions'

      - name: Run canonical wallpaper smoke
        run: '"build/Idlesse.app/Contents/MacOS/Idlesse" -comfort.liveMenuStrip NO --smoke-wallpaper "$PWD/Tests/Fixtures/tiny-loop.mp4"'

      - name: Verify wallpaper resume and backdrop policy
        run: '"build/Idlesse.app/Contents/MacOS/Idlesse" -comfort.liveMenuStrip NO --smoke-resume "$PWD/Tests/Fixtures/tiny-loop.mp4"'

      - name: Verify bundles
        run: |
          file "build/Idlesse.saver/Contents/MacOS/Idlesse"
          plutil -lint "build/Idlesse.saver/Contents/Info.plist"
          plutil -lint "build/Idlesse.app/Contents/Info.plist"
          codesign --verify --strict "build/Idlesse.saver"
          codesign --verify --strict "build/Idlesse.app"

      - name: Verify Finder and Quick Look extensions
        run: |
          set -euo pipefail
          app="build/Idlesse.app"
          thumbnail="$app/Contents/PlugIns/IdlesseThumbnail.appex"
          preview="$app/Contents/PlugIns/IdlesseQuickLook.appex"
          for bundle in "$thumbnail" "$preview"; do
            test -x "$bundle/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
            plutil -lint "$bundle/Contents/Info.plist"
            codesign --verify --strict --verbose=4 "$bundle"
            entitlements="$RUNNER_TEMP/$(basename "$bundle").entitlements.plist"
            codesign --display --entitlements :- "$bundle" 2>&1 | sed -n '/<?xml/,$p' > "$entitlements"
            plutil -lint "$entitlements"
            test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$entitlements")" = "true"
            test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-only' "$entitlements")" = "true"
            ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$entitlements" >/dev/null 2>&1
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$thumbnail/Contents/Info.plist")" = "com.apple.quicklook.thumbnail"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$preview/Contents/Info.plist")" = "com.apple.quicklook.preview"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:QLSupportedContentTypes:0' "$thumbnail/Contents/Info.plist")" = "com.teamleaderleo.idlesse.scene"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:QLSupportedContentTypes:0' "$preview/Contents/Info.plist")" = "com.teamleaderleo.idlesse.scene"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:QLIsDataBasedPreview' "$preview/Contents/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$app/Contents/Info.plist")" = "com.teamleaderleo.idlesse.scene"
