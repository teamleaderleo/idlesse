          '''    private var desktopPreviewSnapshot: StudioDesktopPreviewSnapshot {
        StudioDesktopPreviewSnapshot(scene: scene, time: clock.time, paused: paused,
            pointerEnabled: clock.pointerEnabled, audioEnabled: clock.audioEnabled)
    }

    @objc private func toggleDesktopPreview() {
        if desktopPreviewActive {
            desktopPreviewWork?.cancel(); desktopPreviewWork = nil
            if let onEndDesktopPreview { onEndDesktopPreview() }
            else { desktopPreviewDidEnd(error: nil) }
            return
        }
        commitFieldEdits()
        guard let onBeginDesktopPreview else {
            detailLabel.stringValue = "Desktop preview is unavailable in this host."
            return
        }
        do {
            _ = try scene.evaluated()
            try onBeginDesktopPreview(desktopPreviewSnapshot)
            desktopPreviewActive = true
            updateInspector()
            detailLabel.stringValue = "Previewing this unsaved draft on the desktop · Library and resume state are preserved."
        } catch { detailLabel.stringValue = error.localizedDescription }
    }

    func desktopPreviewDidEnd(error: String?) {
        desktopPreviewWork?.cancel(); desktopPreviewWork = nil
        let wasActive = desktopPreviewActive
        desktopPreviewActive = false
        if wasActive { updateInspector() }
        if let error { detailLabel.stringValue = "Desktop preview ended: " + error }
        else if wasActive { detailLabel.stringValue = "Desktop preview ended · previous wallpaper restored." }
    }

    private func scheduleDesktopPreviewUpdate(scene override: SceneDescriptor? = nil, immediate: Bool = false) {
        guard desktopPreviewActive, let onUpdateDesktopPreview else { return }
        desktopPreviewWork?.cancel()
        let snapshot = StudioDesktopPreviewSnapshot(scene: override ?? scene, time: clock.time, paused: paused,
            pointerEnabled: clock.pointerEnabled, audioEnabled: clock.audioEnabled)
        let work = DispatchWorkItem { [weak self] in
            guard let self, self.desktopPreviewActive else { return }
            if !onUpdateDesktopPreview(snapshot) {
                self.detailLabel.stringValue = "Desktop preview kept the last valid draft. Fix the current edit to update it."
            }
        }
        desktopPreviewWork = work
        if immediate { DispatchQueue.main.async(execute: work) }
        else { DispatchQueue.main.asyncAfter(deadline: .now() + 0.08, execute: work) }
    }

    @discardableResult private func applyEdit(_ nodes: [SceneNode], selected: Int, name: String = "Change Layer", controls: SceneDescriptor? = nil) -> Bool {
