name: Animator 40 desktop preview worker

on:
  push:
    branches:
      - animator/issue-40-desktop-preview
    paths:
      - .github/workflows/animator-40-worker.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: animator/issue-40-desktop-preview

      - name: Build Preview on Desktop on #64 head
        shell: bash
        run: |
          set -euo pipefail
          BASE=dd489c0365aed3cc7d156cb8f57c888c4d349278
          git reset --hard "$BASE"

          python3 <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for label, old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"{path}: missing patch anchor: {label}")
                  text = text.replace(old, new, 1)
              p.write_text(text)

          Path('Sources/Wallpaper/DesktopPreviewSession.swift').write_text(r'''import AppKit

/// Geometry shared by desktop-span rendering and synthetic display-map tests.
enum DesktopPreviewGeometry {
    static func union(_ frames: [CGRect]) -> CGRect {
        frames.reduce(CGRect.null) { $0.union($1) }
    }
}

/// Owns only transient Studio presentation resources. It never owns bookmarks,
/// Library state, resume state, or the committed WallpaperController selection.
final class DesktopPreviewSession {
    private final class FailureGate {
        var generation = 0
        let handler: (String) -> Void
        init(_ handler: @escaping (String) -> Void) { self.handler = handler }
        func callback(for generation: Int) -> (String) -> Void {
            { [weak self] message in
                guard let self, self.generation == generation else { return }
                self.handler(message)
            }
        }
    }

    private struct Prepared {
        let scene: SceneDescriptor
        let clock: SceneClock
        let audioSession: SceneAudioSession
        let surfaces: [WallpaperSurface]
        let hub: SharedVideoHub?
        let studioPaused: Bool
        let pointerEnabled: Bool
        let audioEnabled: Bool
    }

    private(set) var scene: SceneDescriptor
    private(set) var surfaces: [WallpaperSurface]
    private var hub: SharedVideoHub?
    private var clock: SceneClock
    private var audioSession: SceneAudioSession?
    private var studioPaused: Bool
    private var systemPaused: Bool
    private var pointerEnabled: Bool
    private var audioEnabled: Bool
    private let presentsWindows: Bool
    private let configureSurface: (WallpaperSurface) -> Void
    private let gate: FailureGate

    var title: String { scene.title }
    var time: Double { clock.time }

    init(scene: SceneDescriptor, time: Double, studioPaused: Bool, systemPaused: Bool,
         pointerEnabled: Bool, audioEnabled: Bool, presentsWindows: Bool,
         configureSurface: @escaping (WallpaperSurface) -> Void,
         onFatal: @escaping (String) -> Void) throws {
        self.presentsWindows = presentsWindows
        self.configureSurface = configureSurface
        self.gate = FailureGate(onFatal)
        self.systemPaused = systemPaused
        let generation = 1
        gate.generation = generation
        let prepared = try Self.prepare(scene: scene, time: time, studioPaused: studioPaused,
            systemPaused: systemPaused, pointerEnabled: pointerEnabled, audioEnabled: audioEnabled,
            configureSurface: configureSurface, failure: gate.callback(for: generation))
        self.scene = prepared.scene
        self.clock = prepared.clock
        self.audioSession = prepared.audioSession
        self.surfaces = prepared.surfaces
        self.hub = prepared.hub
        self.studioPaused = prepared.studioPaused
        self.pointerEnabled = prepared.pointerEnabled
        self.audioEnabled = prepared.audioEnabled
    }

    private static func prepare(scene: SceneDescriptor, time: Double, studioPaused: Bool,
                                systemPaused: Bool, pointerEnabled: Bool, audioEnabled: Bool,
                                configureSurface: (WallpaperSurface) -> Void,
                                failure: @escaping (String) -> Void) throws -> Prepared {
        _ = try scene.evaluated()
        let clock = SceneClock()
        try clock.configure(timeline: scene.timeline)
        try clock.seek(to: time)
        let audioSession = SceneAudioSession(clock: clock, onError: failure)
        clock.pointerEnabled = pointerEnabled && scene.usesPointer
        clock.audioEnabled = audioEnabled && scene.usesAudio
        clock.setPaused(studioPaused || systemPaused)

        let allNodes = scene.allNodes
        let hasVideo = allNodes.contains { $0.kind == .video }
        let hasCreative = allNodes.contains {
            $0.style != .plain || [.particles, .text, .shape, .gradient, .shader].contains($0.kind) || $0.needsComposition
        }
        let liveMenu = ProcessInfo.processInfo.environment["IDLESSE_LIVE_MENU_STRIP"] == "1" ||
            UserDefaults.standard.bool(forKey: "comfort.liveMenuStrip")
        let needsMetal = scene.requiresMetal || ProcessInfo.processInfo.environment["IDLESSE_METAL_COMPOSITOR"] == "1" ||
            (liveMenu && hasCreative)
        let hub = hasVideo && needsMetal ? SharedVideoHub(scene: scene, clock: clock, onError: failure) : nil
        var surfaces: [WallpaperSurface] = []
        do {
            for screen in NSScreen.screens {
                let surface = try WallpaperSurface(screen: screen, playable: scene, clock: clock,
                    sharedHub: hub, onError: failure)
                configureSurface(surface)
                surface.setMuted(true)
                surface.setPaused(studioPaused || systemPaused)
                surfaces.append(surface)
            }
        } catch {
            hub?.close()
            surfaces.forEach { $0.close() }
            throw error
        }
        return Prepared(scene: scene, clock: clock, audioSession: audioSession, surfaces: surfaces, hub: hub,
                        studioPaused: studioPaused, pointerEnabled: pointerEnabled && scene.usesPointer,
                        audioEnabled: audioEnabled && scene.usesAudio)
    }

    func show() {
        let paused = studioPaused || systemPaused
        hub?.setPaused(paused)
        surfaces.forEach {
            $0.setPaused(paused)
            if presentsWindows { $0.show(paused: paused) }
        }
    }

    func setSystemPaused(_ paused: Bool) {
        systemPaused = paused
        applyPause()
    }

    func update(scene next: SceneDescriptor, time: Double, studioPaused: Bool,
                pointerEnabled: Bool, audioEnabled: Bool) -> Bool {
        do { _ = try next.evaluated() }
        catch { return false }

        // Resource-stable edits stay live. updateScene is transactional per renderer;
        // if one display declines, roll successful siblings back before rebuilding all.
        if scene.timeline == next.timeline, scene.canvas == next.canvas {
            var changed: [WallpaperSurface] = []
            var live = true
            for surface in surfaces {
                if surface.updateScene(next) { changed.append(surface) }
                else { live = false; break }
            }
            if live {
                do {
                    if abs(clock.time - time) > 0.001 { try clock.seek(to: time) }
                    self.scene = next
                    self.studioPaused = studioPaused
                    self.pointerEnabled = pointerEnabled && next.usesPointer
                    self.audioEnabled = audioEnabled && next.usesAudio
                    clock.pointerEnabled = self.pointerEnabled
                    clock.audioEnabled = self.audioEnabled
                    applyPause()
                    return true
                } catch {
                    changed.forEach { _ = $0.updateScene(scene) }
                    return false
                }
            }
            changed.forEach { _ = $0.updateScene(scene) }
        }
        return replace(scene: next, time: time, studioPaused: studioPaused,
                       pointerEnabled: pointerEnabled, audioEnabled: audioEnabled)
    }

    func rebuildForScreens() -> Bool {
        replace(scene: scene, time: clock.time, studioPaused: studioPaused,
                pointerEnabled: pointerEnabled, audioEnabled: audioEnabled)
    }

    private func replace(scene next: SceneDescriptor, time: Double, studioPaused: Bool,
                         pointerEnabled: Bool, audioEnabled: Bool) -> Bool {
        let nextGeneration = gate.generation + 1
        let prepared: Prepared
        do {
            prepared = try Self.prepare(scene: next, time: time, studioPaused: studioPaused,
                systemPaused: systemPaused, pointerEnabled: pointerEnabled, audioEnabled: audioEnabled,
                configureSurface: configureSurface, failure: gate.callback(for: nextGeneration))
        } catch { return false }
        gate.generation = nextGeneration
        let oldSurfaces = surfaces
        let oldHub = hub
        let oldAudio = audioSession
        scene = prepared.scene
        clock = prepared.clock
        audioSession = prepared.audioSession
        surfaces = prepared.surfaces
        hub = prepared.hub
        self.studioPaused = prepared.studioPaused
        self.pointerEnabled = prepared.pointerEnabled
        self.audioEnabled = prepared.audioEnabled
        show()
        oldSurfaces.forEach { $0.close() }
        oldHub?.close()
        withExtendedLifetime(oldAudio) {}
        return true
    }

    private func applyPause() {
        let paused = studioPaused || systemPaused
        clock.setPaused(paused)
        hub?.setPaused(paused)
        surfaces.forEach { $0.setPaused(paused) }
    }

    func close() {
        clock.setPaused(true)
        surfaces.forEach { $0.close() }
        surfaces.removeAll()
        hub?.close(); hub = nil
        audioSession = nil
    }
}
''')

