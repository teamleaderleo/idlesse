          '''    func beginDesktopPreview(scene: SceneDescriptor, time: Double, paused: Bool,
                             pointerEnabled: Bool, audioEnabled: Bool) throws {
        if let preview = desktopPreview {
            guard preview.update(scene: scene, time: time, studioPaused: paused,
                                 pointerEnabled: pointerEnabled, audioEnabled: audioEnabled) else {
                throw SceneError.invalid("The desktop kept the last valid Studio preview.")
            }
            return
        }
        let preview = try DesktopPreviewSession(scene: scene, time: time, studioPaused: paused,
            systemPaused: previewSystemPaused, pointerEnabled: pointerEnabled, audioEnabled: audioEnabled,
            presentsWindows: presentsWindows, configureSurface: { [weak self] surface in
                self?.configureDesktopInteraction(surface)
            }, onFatal: { [weak self] message in
                DispatchQueue.main.async { self?.endDesktopPreview(error: message) }
            })
        finishTransition()
        clock.setPaused(true)
        activeSharedVideoHub?.setPaused(true)
        surfaces.forEach { $0.hide() }
        desktopPreviewNeedsCommittedRebuild = false
        desktopPreview = preview
        preview.show()
        updateMenu()
        onStateChange?()
    }

    @discardableResult func updateDesktopPreview(scene: SceneDescriptor, time: Double, paused: Bool,
                                                   pointerEnabled: Bool, audioEnabled: Bool) -> Bool {
        guard let preview = desktopPreview else { return false }
        let valid = preview.update(scene: scene, time: time, studioPaused: paused,
                                   pointerEnabled: pointerEnabled, audioEnabled: audioEnabled)
        if valid { updateMenu(); onStateChange?() }
        return valid
    }

    func endDesktopPreview(error: String? = nil, notify: Bool = true) {
        guard let preview = desktopPreview else { return }
        desktopPreview = nil
        preview.close()
        if !suspended {
            if desktopPreviewNeedsCommittedRebuild {
                desktopPreviewNeedsCommittedRebuild = false
                rebuild()
            } else {
                clock.setPaused(shouldPause)
                activeSharedVideoHub?.setPaused(shouldPause)
                activeSharedVideoHub?.setMuted(!soundEnabled)
                surfaces.forEach { $0.setMuted(!soundEnabled); $0.show(paused: shouldPause) }
            }
        }
        updateMenu()
        onStateChange?()
        if notify { onDesktopPreviewEnded?(error) }
    }

    func select(_ url: URL, reloading: Bool = false, automatic: Bool = false, restoringPause: Bool? = nil, transient: Bool = false) {
        if isDesktopPreviewing { endDesktopPreview() }
        if !reloading && !automatic { onManualSelection?() }
