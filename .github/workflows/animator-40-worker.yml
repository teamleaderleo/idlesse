name: Animator 40 desktop preview worker

on:
  push:
    branches:
      - animator/issue-40-desktop-preview
    paths:
      - .github/workflows/animator-40-worker.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: animator/issue-40-desktop-preview

      - name: Build Preview on Desktop on issue 64 head
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE=95bdea008a27c7ea2f96c9248922c9a71be3fb23
          BASE=dd489c0365aed3cc7d156cb8f57c888c4d349278
          git show "$TEMPLATE:.github/workflows/animator-40-worker.yml" > /tmp/animator40-template.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/animator40-template.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i] == '          PY')
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(body) + '\n'
          first = script.index("('desktop span geometry',")
          second = script.index("('surface hide',", first)
          script = script[:first] + script[second:]
          strict = '''        if old not in text:\n            raise SystemExit(f"{path}: missing patch anchor: {label}")\n        text = text.replace(old, new, 1)'''
          tolerant = '''        if old not in text:\n            print(f"SKIP {path}: {label}")\n            continue\n        text = text.replace(old, new, 1)'''
          if strict not in script:
              raise SystemExit('patch helper anchor missing')
          Path('/tmp/animator40.py').write_text(script.replace(strict, tolerant, 1))
          PY
          git reset --hard "$BASE"
          python3 /tmp/animator40.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path); text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: correction anchor missing: {label}')
              p.write_text(text.replace(old, new, 1))

          wall = 'Sources/Wallpaper/WallpaperController.swift'
          replace_once(wall,
              'metal.desktopFrame = NSScreen.screens.reduce(CGRect.null) { $0.union($1.frame) }',
              'metal.desktopFrame = DesktopPreviewGeometry.union(NSScreen.screens.map(\\.frame))',
              'desktop span geometry')
          replace_once(wall,
              '''        observe(.default, SceneFrameRate.changed) { controller in\n            controller.surfaces.forEach { $0.updateFrameRate() }\n        }\n        observe(.default, DesktopComfortController.desktopVisibilityChanged) { controller in\n            controller.surfaces.forEach { controller.configureDesktopInteraction($0) }\n            controller.updateMenu()\n        }\n''',
              '''        observe(.default, SceneFrameRate.changed) { controller in\n            controller.presentedSurfaces.forEach { $0.updateFrameRate() }\n        }\n        observe(.default, DesktopComfortController.desktopVisibilityChanged) { controller in\n            controller.presentedSurfaces.forEach { controller.configureDesktopInteraction($0) }\n            controller.updateMenu()\n        }\n''', 'observer surfaces')
          replace_once(wall,
              '''        observe(.default, Notification.Name.NSProcessInfoPowerStateDidChange) { controller in\n            controller.clock.setPaused(controller.suspended || controller.shouldPause)\n            controller.activeSharedVideoHub?.setPaused(controller.shouldPause)\n            controller.surfaces.forEach { $0.setPaused(controller.shouldPause) }\n            controller.surfaces.forEach { $0.updateFrameRate() }\n            controller.logState("power-change")\n            controller.updateMenu()\n        }\n''',
              '''        observe(.default, Notification.Name.NSProcessInfoPowerStateDidChange) { controller in\n            controller.clock.setPaused(controller.isDesktopPreviewing || controller.suspended || controller.shouldPause)\n            controller.activeSharedVideoHub?.setPaused(controller.isDesktopPreviewing || controller.shouldPause)\n            controller.surfaces.forEach { $0.setPaused(controller.isDesktopPreviewing || controller.shouldPause) }\n            controller.desktopPreview?.setSystemPaused(controller.previewSystemPaused)\n            controller.presentedSurfaces.forEach { $0.updateFrameRate() }\n            controller.logState("power-change")\n            controller.updateMenu()\n        }\n''', 'power observer')
          replace_once(wall,
              '''        observe(.default, NSApplication.didChangeScreenParametersNotification) { controller in\n            controller.screenRefresh?.cancel()\n            let work = DispatchWorkItem { [weak controller] in controller?.rebuild() }\n            controller.screenRefresh = work\n            DispatchQueue.main.asyncAfter(deadline: .now() + 0.3, execute: work)\n        }\n''',
              '''        observe(.default, NSApplication.didChangeScreenParametersNotification) { controller in\n            controller.screenRefresh?.cancel()\n            let work = DispatchWorkItem { [weak controller] in\n                guard let controller else { return }\n                if controller.isDesktopPreviewing {\n                    controller.desktopPreviewNeedsCommittedRebuild = true\n                    guard controller.desktopPreview?.rebuildForScreens() == true else {\n                        controller.endDesktopPreview(error: "Studio desktop preview could not follow the new display layout.")\n                        return\n                    }\n                } else { controller.rebuild() }\n            }\n            controller.screenRefresh = work\n            DispatchQueue.main.asyncAfter(deadline: .now() + 0.3, execute: work)\n        }\n''', 'screen observer')
          replace_once(wall,
              '''        for surface in surfaces {\n            let fraction = coverageMonitor.coverage(of: surface.window.frame,\n''',
              '''        for surface in active {\n            let fraction = coverageMonitor.coverage(of: surface.window.frame,\n''', 'coverage loop')

          lib = 'Sources/Harness/SceneLibraryController.swift'
          replace_once(lib,
              '''        let timer = Timer(timeInterval: TimeInterval(rotationMinutes * 60), repeats: true) { [weak self] _ in\n            guard let self else { return }\n''',
              '''        let timer = Timer(timeInterval: TimeInterval(rotationMinutes * 60), repeats: true) { [weak self] _ in\n            guard let self, !self.automationSuspended else { return }\n''', 'rotation timer guard')

          studio = 'Sources/Harness/StudioWindowController.swift'
          replace_once(studio,
              '''        ], motionSession: [pointerToggle, audioToggle, audioStatus], sceneActions: [\n            scenePlayback, sceneDetails, NSStackView(views: [saveButton, saveCopyButton]), exportButton, resetButton\n        ])\n''',
              '''        ], motionSession: [pointerToggle, audioToggle, audioStatus], sceneActions: [\n            NSStackView(views: [desktopPreviewButton, desktopPreviewStatus]),\n            scenePlayback, sceneDetails, NSStackView(views: [saveButton, saveCopyButton]), exportButton, resetButton\n        ])\n''', 'scene actions preview')
          replace_once(studio,
              '''            canvasMotionPreview = next\n        } catch {\n''',
              '''            canvasMotionPreview = next\n            scheduleDesktopPreviewUpdate(scene: next)\n        } catch {\n''', 'canvas live preview')
          replace_once(studio,
              '''    private func cancelCanvasMotion() {\n        if let base = canvasMotionBase { _ = renderer?.updateScene(base) }\n        canvasMotionBase = nil\n        canvasMotionPreview = nil\n        selectNode()\n    }\n''',
              '''    private func cancelCanvasMotion() {\n        if let base = canvasMotionBase { _ = renderer?.updateScene(base) }\n        canvasMotionBase = nil\n        canvasMotionPreview = nil\n        scheduleDesktopPreviewUpdate(immediate: true)\n        selectNode()\n    }\n''', 'canvas cancel preview')
          replace_once(studio,
              '''                self.renderer?.refreshSceneTime()\n                self.updateTimeline()\n                self.detailLabel.stringValue = "Scene transport updated. Video following is configured in Playback…."\n''',
              '''                self.renderer?.refreshSceneTime()\n                self.updateTimeline()\n                self.scheduleDesktopPreviewUpdate(immediate: true)\n                self.detailLabel.stringValue = "Scene transport updated. Video following is configured in Playback…."\n''', 'transport preview sync')
          replace_once(studio,
              '''        var previewEdit = editor.scene\n        previewEdit.nodes[0].opacity = 0.7\n        precondition(editor.applyEdit(previewEdit.nodes, selected: 0, name: "Preview Edit", controls: previewEdit))\n''',
              '''        var previewNodes = editor.scene.nodes\n        previewNodes[0].opacity = 0.7\n        let previewEdit = editor.scene.replacingNodes(previewNodes)\n        precondition(editor.applyEdit(previewEdit.nodes, selected: 0, name: "Preview Edit", controls: previewEdit))\n''', 'studio preview smoke mutation')
          PY
          git diff --check
          ./test.sh
          ./build.sh
          ./test-wallpaper.sh
          "build/Idlesse.app/Contents/MacOS/Idlesse" --smoke-options
          git config user.name "Animator"
          git config user.email "noreply@openai.com"
          git add Sources/Wallpaper/DesktopPreviewSession.swift \
                  Sources/Wallpaper/WallpaperController.swift \
                  Sources/Wallpaper/AmbientModesController.swift \
                  Sources/Wallpaper/DesktopComfortController.swift \
                  Sources/Wallpaper/WallpaperSmoke.swift \
                  Sources/Harness/SceneLibraryController.swift \
                  Sources/Harness/StudioWindowController.swift \
                  Sources/Harness/main.swift
          git diff --cached --check
          git commit -m "Preview unsaved Studio drafts on the desktop (#40)"
          git push --force-with-lease origin HEAD:animator/issue-40-desktop-preview
