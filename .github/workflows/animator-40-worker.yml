          with Path('Sources/Wallpaper/DesktopPreviewSession.swift').open('a') as f:
              f.write(r'''

extension WallpaperController {
    static func smokeDesktopPreview(videoURL: URL) throws {
        let union = DesktopPreviewGeometry.union([
            CGRect(x: -1280, y: 0, width: 1280, height: 800),
            CGRect(x: 0, y: 120, width: 1920, height: 1080)
        ])
        precondition(union == CGRect(x: -1280, y: 0, width: 3200, height: 1200),
                     "Desktop-span geometry must preserve display offsets and gaps")

        let suite = "Idlesse.DesktopPreviewSmoke." + UUID().uuidString
        let defaults = UserDefaults(suiteName: suite)!
        defer { defaults.removePersistentDomain(forName: suite) }
        let controller = WallpaperController()
        controller.resumeDefaults = defaults
        controller.persistsSelection = true
        controller.presentsWindows = false
        controller.onError = { _ in }
        controller.select(videoURL)
        let deadline = Date().addingTimeInterval(15)
        while controller.isLoading && Date() < deadline {
            _ = RunLoop.current.run(mode: .default, before: Date().addingTimeInterval(0.02))
        }
        precondition(controller.selectedURL == videoURL && !controller.isLoading)
        let resume = defaults.data(forKey: "wallpaperResumeBookmark")
        precondition(resume != nil)
        let committedPaused = controller.pausedByUser

        for cycle in 0..<3 {
            let span = SceneDescriptor(title: "Studio Span \(cycle)", nodes: [SceneNode(content: .gradient)], canvas: .desktopSpan)
            try controller.beginDesktopPreview(scene: span, time: 0.25, paused: false,
                                               pointerEnabled: false, audioEnabled: false)
            precondition(controller.isDesktopPreviewing)
            precondition(controller.selectedURL == videoURL && controller.pausedByUser == committedPaused)
            precondition(defaults.data(forKey: "wallpaperResumeBookmark") == resume)
            var next = span
            next.nodes[0].opacity = 0.6
            next = SceneDescriptor(title: "Studio Valid \(cycle)", nodes: next.nodes, canvas: .desktopSpan)
            precondition(controller.updateDesktopPreview(scene: next, time: 0.5, paused: true,
                                                         pointerEnabled: false, audioEnabled: false))
            precondition(controller.desktopPreviewTitle == "Studio Valid \(cycle)")
            var badNode = next.nodes[0]
            badNode.opacity = 2
            let invalid = SceneDescriptor(title: "Invalid", nodes: [badNode], canvas: .desktopSpan)
            precondition(!controller.updateDesktopPreview(scene: invalid, time: 0.5, paused: true,
                                                          pointerEnabled: false, audioEnabled: false))
            precondition(controller.desktopPreviewTitle == "Studio Valid \(cycle)",
                         "An invalid edit must retain the last valid desktop preview")
            controller.endDesktopPreview()
            precondition(!controller.isDesktopPreviewing && controller.selectedURL == videoURL)
            precondition(controller.pausedByUser == committedPaused)
            precondition(defaults.data(forKey: "wallpaperResumeBookmark") == resume)
        }
        controller.stop()
    }
}
''')
